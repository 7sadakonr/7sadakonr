name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF7777&color_dots=#F3F4F6,#EDE9FE,#C4B5FD,#8B5CF6,#5B21B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF7777&color_dots=#21262D,#3B0764,#6D28D9,#9333EA,#C084FC

      - name: Build self-contained terminal activity card
        run: python3 .github/scripts/build_activity_terminal.py

      - name: Publish profile activity assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
