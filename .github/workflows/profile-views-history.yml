name: Profile Views History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * *"
  push:
    paths:
      - ".github/workflows/profile-views-history.yml"
      - "scripts/update_profile_views.py"

permissions:
  contents: write

jobs:
  update-profile-views:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record visitor snapshot and generate chart
        run: python scripts/update_profile_views.py

      - name: Commit updated history
        run: |
          if git diff --quiet -- data/profile-views.json assets/profile-views-history.svg; then
            echo "No profile view changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile-views.json assets/profile-views-history.svg
          git commit -m "Update profile views history"
          git push
